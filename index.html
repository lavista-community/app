<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Vista Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, sans-serif; }
        .hidden { display: none !important; }
        .login-card { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .menu-tile { background: white; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; aspect-ratio: 1/1; font-weight: 500; font-size: 14px; }
        .menu-tile i { font-size: 32px; margin-bottom: 8px; }
        .qr-tile { background: #212529; color: white; }
        .form-control { border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="loginUI" class="container min-vh-100 d-flex align-items-center">
    <div class="login-card text-center">
        <h4>La Vista Portal</h4>
        <input type="email" id="emailInput" class="form-control" placeholder="Email">
        <input type="password" id="passwordInput" class="form-control" placeholder="Password">
        <button onclick="attemptLogin()" class="btn btn-primary w-100">Sign In</button>
    </div>
</div>

<div id="dashboardUI" class="hidden container pt-4">
    <h3 class="text-center text-primary">Hello, Boc</h3>
    <p class="text-center text-muted">La Vista Community Services</p>
    <div class="menu-grid">
        <div class="menu-tile"><i class="bi bi-megaphone text-primary"></i>Announcements</div>
        <div class="menu-tile"><i class="bi bi-calendar-event text-danger"></i>Calendar</div>
        <div class="menu-tile"><i class="bi bi-basketball text-warning"></i>Courts</div>
        <div class="menu-tile"><i class="bi bi-journal-check text-success"></i>Guest Registration</div>
        <div class="menu-tile" onclick="showSection('deliverySection')"><i class="bi bi-scooter text-info"></i>Deliveries</div>
        <div class="menu-tile"><i class="bi bi-door-open text-primary"></i>Staff Pass</div>
        <div class="menu-tile"><i class="bi bi-window text-purple"></i>My Window</div>
        <div class="menu-tile qr-tile"><i class="bi bi-qr-code"></i>QR Scanner</div>
    </div>
</div>

<div id="deliverySection" class="hidden container pt-4">
    <div class="bg-white p-4 rounded-4 shadow-sm">
        <h5>Register Delivery</h5>
        <input type="text" id="riderNameInput" class="form-control" placeholder="Courier Name">
        <input type="date" id="deliveryDateInput" class="form-control">
        <button onclick="submitDelivery()" class="btn btn-primary w-100">Log Delivery</button>
        <button onclick="showSection('dashboardUI')" class="btn btn-link w-100 mt-2 text-muted">Back</button>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRt3lWEX3mFPYgN8Dia5zfw2z3q2HIyVTOGgQ0-ASbZd0KKEnd9Au9pnPgtx0wwbId/exec";
    
    function callBackend(params, callback) {
        const url = APPS_SCRIPT_URL + "?callback=loadData&" + new URLSearchParams(params).toString();
        const script = document.createElement('script');
        window.loadData = (data) => { document.body.removeChild(script); callback(data); };
        script.src = url;
        document.body.appendChild(script);
    }

    function showSection(id) {
        document.getElementById('loginUI').classList.add('hidden');
        document.getElementById('dashboardUI').classList.add('hidden');
        document.getElementById('deliverySection').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function attemptLogin() {
        const email = document.getElementById('emailInput').value;
        callBackend({ action: "getUserData", email: email }, (data) => {
            if (data.result === "success") { showSection('dashboardUI'); }
            else { alert("Error: " + data.message); }
        });
    }

    function submitDelivery() {
        const rider = document.getElementById('riderNameInput').value;
        const date = document.getElementById('deliveryDateInput').value;
        callBackend({ action: "registerDelivery", riderName: rider, dateExpected: date }, (data) => {
            alert("Delivery Logged!");
            showSection('dashboardUI');
        });
    }
</script>
</body>
</html>
