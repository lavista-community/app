<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Vista Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .menu-tile { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginUI" class="container py-5 text-center">
    <h2>La Vista Portal</h2>
    <input type="email" id="emailInput" class="form-control mb-2" placeholder="Email">
    <button onclick="attemptLogin()" id="loginBtn" class="btn btn-primary w-100">Sign In</button>
</div>

<div id="dashboardUI" class="hidden container py-5">
    <h3 id="welcomeMsg">Hello!</h3>
    <div class="row g-3">
        <div class="col-6"><div class="menu-tile" onclick="showSection('deliverySection')">Deliveries</div></div>
        <div class="col-6"><div class="menu-tile" onclick="showSection('guestSection')">Guest Reg</div></div>
        <div class="col-6"><div class="menu-tile" onclick="showSection('staffSection')">Staff Pass</div></div>
    </div>
</div>

<div id="deliverySection" class="hidden container py-5">
    <h4>Register Delivery</h4>
    <input type="text" id="riderNameInput" class="form-control" placeholder="Courier Name">
    <input type="date" id="deliveryDateInput" class="form-control">
    <button onclick="submitDelivery()" id="deliveryBtn" class="btn btn-primary w-100">Log Delivery</button>
    <button onclick="showSection('dashboardUI')" class="btn btn-link w-100">Back</button>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRt3lWEX3mFPYgN8Dia5zfw2z3q2HIyVTOGgQ0-ASbZd0KKEnd9Au9pnPgtx0wwbId/exec";
    let currentUser = null;

    function callBackend(params, callback) {
        const url = APPS_SCRIPT_URL + "?callback=loadData&" + new URLSearchParams(params).toString();
        const script = document.createElement('script');
        window.loadData = (data) => { document.body.removeChild(script); callback(data); };
        script.src = url;
        document.body.appendChild(script);
    }

    function showSection(id) {
        document.getElementById('loginUI').classList.add('hidden');
        document.getElementById('dashboardUI').classList.add('hidden');
        document.getElementById('deliverySection').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function attemptLogin() {
        const email = document.getElementById('emailInput').value;
        callBackend({ action: "getUserData", email: email }, (data) => {
            if (data.result === "success") {
                currentUser = data;
                document.getElementById('welcomeMsg').innerText = "Hello, " + data.info.firstName + "!";
                showSection('dashboardUI');
            } else { alert("Error: " + data.message); }
        });
    }

    function submitDelivery() {
        const rider = document.getElementById('riderNameInput').value;
        const date = document.getElementById('deliveryDateInput').value;
        callBackend({ action: "registerDelivery", riderName: rider, dateExpected: date, surname: currentUser.info.surname, firstName: currentUser.info.firstName, address: currentUser.info.address }, (data) => {
            alert(data.result === "success" ? "Logged!" : "Error");
            if(data.result === "success") showSection('dashboardUI');
        });
    }
</script>
</body>
</html>
