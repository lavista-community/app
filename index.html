<script>
    function resetPassWizardForm() {
        document.getElementById('regGuestName').value = "";
        document.getElementById('regExpectedDate').value = "";
        document.getElementById('regCustomLocation').value = "";
        document.getElementById('regEventLocation').selectedIndex = 0;
        document.getElementById("passRegistrationWizardForm").classList.remove("hidden");
        document.getElementById("passRegistrationReceiptContainer").classList.add("hidden");
    }

    function submitStaffForm() {
        const staffName = document.getElementById('regStaffName').value.trim();
        if (!staffName) { alert("Please input staff name details."); return; }
        
        document.getElementById('submitStaffBtn').innerText = "Processing Pipeline...";
        document.getElementById('submitStaffBtn').disabled = true;
        
        callBackend({
            action: "registerStaffPass",
            email: currentUser.email,
            staffName: staffName
        }, (data) => {
            document.getElementById('submitStaffBtn').disabled = false;
            document.getElementById('submitStaffBtn').innerText = "Authorize Staff Profile";
            if (data.result === "success") {
                alert("Staff workers registry updated successfully!");
                document.getElementById('regStaffName').value = "";
                showView('dashboardUI');
            } else {
                alert("Error: " + data.message);
            }
        });
    }

    function openMyWindowView() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('manifestDate').value = today;
        showView('myWindowUI');
        loadMyWindow();
    }

    function loadMyWindow() {
        const selectedDate = document.getElementById('manifestDate').value;
        const guestsList = document.getElementById('myWindowGuestsList');
        const deliveriesList = document.getElementById('myWindowDeliveriesList');
        const staffList = document.getElementById('myWindowStaffList');
        
        guestsList.innerHTML = "<div class='text-muted small p-2'>Loading manifest framework logs...</div>";
        deliveriesList.innerHTML = "<div class='text-muted small p-2'>Loading logs...</div>";
        staffList.innerHTML = "<div class='text-muted small p-2'>Loading staff...</div>";
        
        callBackend({
            action: "getMyWindowData",
            email: currentUser.email,
            date: selectedDate
        }, (data) => {
            if (data.result === "success") {
                guestsList.innerHTML = "";
                deliveriesList.innerHTML = "";
                staffList.innerHTML = "";
                
                let hasGuests = false;
                let hasStaff = false;
                
                data.records.forEach(rec => {
                    const item = document.createElement('div');
                    item.className = "p-3 mb-2 bg-white rounded-3 small border d-flex justify-content-between align-items-center shadow-sm";
                    
                    if (rec.category === "GUEST" || rec.category === "EVENT") {
                        hasGuests = true;
                        const passDate = rec.date || rec.dateExpected || '';
                        const parsedDate = new Date(passDate);
                        const options = { month: 'short', day: 'numeric', year: 'numeric' };
                        const cleanDisplayDate = (isNaN(parsedDate) || !passDate) ? passDate : parsedDate.toLocaleDateString('en-US', options);
                        
                        const tokenKey = rec.qrId || rec.type || '';
                        console.log("Raw record data from backend:", rec);
                        const safeName = rec.name.replace(/'/g, "\\'");
                        
                        item.innerHTML = `
                            <div onclick="openPassRecoveryModal('${tokenKey}', '${safeName}', '${cleanDisplayDate}')" style="cursor: pointer;">
                                <div class='fw-bold text-primary d-flex align-items-center' style='text-decoration: underline; text-underline-offset: 3px;'>
                                    <span>${rec.name}</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" class="bi bi-qr-code text-primary ms-1.5" viewBox="0 0 16 16" style="margin-left: 6px; opacity: 0.85;">
                                        <path d="M2 2h2v2H2V2Z M6 0v6H0V0h6ZM5 1H1v4h4V1ZM4 12H2v2h2v-2Z M6 8v6H0V8h6V8Zm-1 1H1v4h4V9ZM16 0v6h-6V0h6Zm-1 1h-4v4h4V1Z M9 9h1v1H9V9Zm1 0h1v1h-1V9Zm-1 1h1v1H9v-1Zm1 0h1v1h-1v-1Zm-2 1h1v1H8v-1Zm1 0h1v1h-1v-1Zm-1 1h1v1H8v-1Zm1 0h1v1h-1v-1Zm2-3h1v1h-1V8Zm1 0h1v1h-1V8Zm-1 1h1v1h-1V9Zm1 0h1v1h-1V9Zm1 3h1v1h-1v-1Zm0-1h1v1h-1v-1Zm-1 0h1v1h-1v-1Zm-2-2h1v1H9V8Zm1 0h1v1h-1V8Z"/>
                                    </svg>
                                </div>
                                <div class='text-muted micro-text' style='font-size: 11px; margin-top: 2px;'>Click to view pass</div>
                            </div>
                            <span class='badge ${rec.status === "ARRIVED" ? "bg-success" : "bg-primary"}'>${rec.status}</span>
                        `;
                        guestsList.appendChild(item);
                    } else if (rec.category === "STAFF") {
                        hasStaff = true;
                        item.innerHTML = `
                            <div><div class='fw-bold text-dark'>${rec.name}</div><div class='text-muted micro-text' style='font-size:11px;'>${rec.type}</div></div>
                            <span class='badge bg-secondary'>${rec.status}</span>
                        `;
                        staffList.appendChild(item);
                    }
                });
                
                if (!hasGuests) guestsList.innerHTML = "<div class='text-muted small p-2 bg-light rounded border text-center'>No visitor records found.</div>";
                if (!hasStaff) staffList.innerHTML = "<div class='text-muted small p-2 bg-light rounded border text-center'>No staff registry listed.</div>";
                deliveriesList.innerHTML = "<div class='text-muted small p-2 bg-light rounded border text-center'>No domestic delivery packages captured.</div>";
            } else {
                alert("Error handling view update: " + data.message);
            }
        });
    }

    function openPassRecoveryModal(qrId, name, date) {
        if (!qrId) {
            alert("No token identifier associated with this entry record.");
            return;
        }
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=10&data=${encodeURIComponent(qrId)}`;
        document.getElementById("recoverQrImage").src = qrApiUrl;
        document.getElementById("recoverMetaName").innerText = name;
        document.getElementById("recoverMetaDate").innerText = date;
        document.getElementById("recoverMetaId").innerText = qrId;
        document.getElementById("passRecoveryModal").classList.remove("hidden");
    }

    function closePassRecoveryModal() {
        document.getElementById("passRecoveryModal").classList.add("hidden");
        document.getElementById("recoverQrImage").src = "";
    }
    
    function resetScannerUIState() {
        scannedQrId = "";
        currentPassType = "";
        
        const banner = document.getElementById('scannerStatusFlash');
        banner.className = "status-flash-banner mb-3 hidden";
        banner.innerText = "";
        
        document.getElementById('scannedQrTokenDisplay').innerText = "NONE";
        document.getElementById('individualFieldsWrapper').classList.add('hidden');
        document.getElementById('eventFieldsWrapper').classList.add('hidden');
        document.getElementById('manualFieldsWrapper').classList.add('hidden');
        document.getElementById('confirmEntryBtn').classList.add('hidden');
        document.getElementById('manualOverrideLinkWrapper').classList.remove('hidden');
        document.getElementById('cameraViewfinderContainer').classList.remove('hidden');
        
        document.getElementById('individualPlateInput').value = "";
        document.getElementById('eventGuestNameInput').value = "";
        document.getElementById('eventPlateInput').value = "";
        document.getElementById('manualAddressInput').value = "";
        document.getElementById('manualResidentSelect').innerHTML = '<option value="">-- Select Resident Name --</option>';
        document.getElementById('manualCustomNameWrapper').classList.add('hidden');
        document.getElementById('manualCustomNameInput').value = "";
        document.getElementById('manualGuestNameInput').value = "";
        document.getElementById('manualPlateInput').value = "";
    }

    function openScannerUI() {
        showView('scannerUI');
        resetScannerUIState();

        callBackend({ action: "getDirectoryMetadata" }, (data) => {
            if (data.result === "success") {
                residentDirectoryData = data.directory;
                buildAddressDatalistSuggestions();
            }
        });

        if (html5QrScannerInstance === null) {
            html5QrScannerInstance = new Html5Qrcode("qr-camera-element");
        }
        
        const scanConfig = { fps: 12, qrbox: { width: 260, height: 260 } };
        html5QrScannerInstance.start(
            { facingMode: "environment" },
            scanConfig,
            onScannerCaptureSuccess,
            onScannerCaptureFailure
        ).catch(err => console.error("Camera access issue detected: ", err));
    }

    function shutdownCameraStream() {
        if (html5QrScannerInstance && html5QrScannerInstance.isScanning) {
            html5QrScannerInstance.stop().catch(err => console.error("Camera stop process anomaly: ", err));
        }
    }

    function onScannerCaptureSuccess(decodedText) {
        scannedQrId = decodedText.toUpperCase().trim();
        document.getElementById('scannedQrTokenDisplay').innerText = scannedQrId;
        
        shutdownCameraStream();
        document.getElementById('cameraViewfinderContainer').classList.add('hidden');
        document.getElementById('manualOverrideLinkWrapper').classList.add('hidden');

        if (scannedQrId.indexOf("R-") === 0) {
            processIndividualGatePass(scannedQrId);
        } else if (scannedQrId.indexOf("E-") === 0) {
            initializeEventGatePassView();
        } else {
            initializeInvalidGatePassView();
        }
    }

    function onScannerCaptureFailure(error) {
        // Continuous scan loop fallback
    }

    function processIndividualGatePass(qrId) {
        currentPassType = "INDIVIDUAL";

        const banner = document.getElementById('scannerStatusFlash');
        banner.className = "status-flash-banner mb-3 bg-success text-white py-3 fs-3 text-center fw-bold";
        banner.innerText = "ENTRY ALLOWED";
        banner.classList.remove('hidden');

        document.getElementById('individualFieldsWrapper').classList.remove('hidden');

        const confirmBtn = document.getElementById('confirmEntryBtn');
        confirmBtn.className = "btn btn-success w-100 py-2.5 fs-5";
        confirmBtn.innerText = "Confirm Entry";
        confirmBtn.classList.remove('hidden');
    }

    function initializeEventGatePassView() {
        currentPassType = "EVENT";
        
        const banner = document.getElementById('scannerStatusFlash');
        banner.className = "status-flash-banner mb-3 bg-success text-white py-3 fs-3 text-center fw-bold";
        banner.innerText = "ENTRY ALLOWED";
        banner.classList.remove('hidden');

        document.getElementById('eventFieldsWrapper').classList.remove('hidden');
        
        const confirmBtn = document.getElementById('confirmEntryBtn');
        confirmBtn.className = "btn btn-success w-100 py-2.5 fs-5";
        confirmBtn.innerText = "Confirm Event Entry";
        confirmBtn.classList.remove('hidden');
    }

    function initializeInvalidGatePassView() {
        currentPassType = "INVALID";
        
        const banner = document.getElementById('scannerStatusFlash');
        banner.className = "status-flash-banner mb-3 bg-danger text-white py-3 fs-5 text-center fw-bold";
        banner.innerText = "QR INVALID. FOR MANUAL LOGGING";
        banner.classList.remove('hidden');

        document.getElementById('manualFieldsWrapper').classList.remove('hidden');
        
        const confirmBtn = document.getElementById('confirmEntryBtn');
        confirmBtn.className = "btn btn-danger w-100 py-2.5 fs-5";
        confirmBtn.innerText = "Confirm Entry";
        confirmBtn.classList.remove('hidden');
    }

    function initializeAlreadyArrivedGatePassView() {
        currentPassType = "ALREADY_ARRIVED";
        
        const banner = document.getElementById('scannerStatusFlash');
        banner.className = "status-flash-banner mb-3 bg-danger text-white py-3 fs-3 text-center fw-bold";
        banner.innerHTML = "⚠️ PASS ALREADY ARRIVED";
        banner.classList.remove('hidden');

        document.getElementById('manualFieldsWrapper').classList.remove('hidden');
        
        const confirmBtn = document.getElementById('confirmEntryBtn');
        confirmBtn.className = "btn btn-danger w-100 py-2.5 fs-5";
        confirmBtn.innerText = "Confirm Entry";
        confirmBtn.classList.remove('hidden');
    }

    function triggerPureManualOverride(event) {
        if(event) event.preventDefault();
        scannedQrId = "MANUAL";
        document.getElementById('scannedQrTokenDisplay').innerText = "MANUAL LOGGING OVERRIDE";
        
        shutdownCameraStream();
        document.getElementById('cameraViewfinderContainer').classList.add('hidden');
        document.getElementById('manualOverrideLinkWrapper').classList.add('hidden');
        
        initializeInvalidGatePassView();
    }

    function buildAddressDatalistSuggestions() {
        const dl = document.getElementById('addressDatalist');
        dl.innerHTML = "";
        Object.keys(residentDirectoryData).forEach(addressKey => {
            const opt = document.createElement('option');
            opt.value = addressKey;
            dl.appendChild(opt);
        });
    }

    function handleManualAddressInput() {
        const enteredVal = document.getElementById('manualAddressInput').value.trim();
        const resSelect = document.getElementById('manualResidentSelect');
        
        resSelect.innerHTML = '<option value="">-- Select Resident Name --</option>';
        document.getElementById('manualCustomNameWrapper').classList.add('hidden');

        const realKey = Object.keys(residentDirectoryData).find(k => k.toLowerCase() === enteredVal.toLowerCase());
        if (realKey) {
            const residentArray = residentDirectoryData[realKey];
            residentArray.forEach((res, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${res.surname}, ${res.firstName}`;
                resSelect.appendChild(opt);
            });
            const optOthers = document.createElement('option');
            optOthers.value = "OTHERS";
            optOthers.innerText = "Others";
            resSelect.appendChild(optOthers);
        }
        evaluateLiveScreeningDirectives();
    }

    function handleResidentSelectionChange() {
        const selectVal = document.getElementById('manualResidentSelect').value;
        if (selectVal === "OTHERS") {
            document.getElementById('manualCustomNameWrapper').classList.remove('hidden');
        } else {
            document.getElementById('manualCustomNameWrapper').classList.add('hidden');
        }
        evaluateLiveScreeningDirectives();
    }

    function evaluateLiveScreeningDirectives() {
        const enteredVal = document.getElementById('manualAddressInput').value.trim();
        const selectVal = document.getElementById('manualResidentSelect').value;
        const banner = document.getElementById('scannerStatusFlash');
        const confirmBtn = document.getElementById('confirmEntryBtn');

        const realKey = Object.keys(residentDirectoryData).find(k => k.toLowerCase() === enteredVal.toLowerCase());
        if (!realKey || !selectVal) {
            if (currentPassType === "ALREADY_ARRIVED") {
                banner.className = "status-flash-banner mb-3 bg-danger text-white py-3 fs-3 text-center fw-bold";
                banner.innerHTML = "⚠️ PASS ALREADY ARRIVED";
            } else {
                banner.className = "status-flash-banner mb-3 bg-danger text-white py-3 fs-5 text-center fw-bold";
                banner.innerText = "QR INVALID. FOR MANUAL LOGGING";
            }
            confirmBtn.className = "btn btn-danger w-100 py-2.5 fs-5";
            confirmBtn.innerText = "Confirm Entry";
            return;
        }

        const residents = residentDirectoryData[realKey];
        let alertScreeningRequired = false;
        let mappedTargetPhone = "";

        if (selectVal === "OTHERS") {
            const holdsYesFlag = residents.some(r => r.screening === "YES");
            if (holdsYesFlag) {
                alertScreeningRequired = true;
                const activeNumbers = residents.map(r => r.contact1).filter(num => num && num.trim() !== "");
                mappedTargetPhone = activeNumbers.length > 0 ? activeNumbers[0] : "No registered phone found";
            }
        } else {
            const activeProfile = residents[parseInt(selectVal)];
            if (activeProfile.screening === "YES") {
                alertScreeningRequired = true;
                mappedTargetPhone = activeProfile.contact1 || "No registered phone found";
            }
        }

        if (alertScreeningRequired) {
            banner.className = "status-flash-banner mb-3 bg-warning text-dark py-2 small text-center";
            banner.innerHTML = `⚠️ <strong>VERIFICATION REQUIRED</strong><br>Call Resident: ${mappedTargetPhone}`;
            confirmBtn.className = "btn btn-warning text-dark w-100 py-2.5 fw-bold fs-5";
            confirmBtn.innerText = "Confirmed with Resident";
        } else {
            banner.className = "status-flash-banner mb-3 bg-success text-white py-3 fs-3 text-center fw-bold";
            banner.innerText = "ENTRY ALLOWED";
            confirmBtn.className = "btn btn-success w-100 py-2.5 fs-5";
            confirmBtn.innerText = "Confirm Entry";
        }
    }

    function executeLogSubmission() {
        let submissionPayload = { action: "confirmArrival" };

        if (currentPassType === "INDIVIDUAL") {
            const plateNo = document.getElementById('individualPlateInput').value.trim();
            submissionPayload.qrId = scannedQrId;
            submissionPayload.isManualLog = "false";
            submissionPayload.plate = plateNo;

        } else if (currentPassType === "EVENT") {
            const guestName = document.getElementById('eventGuestNameInput').value.trim();
            const plateNo = document.getElementById('eventPlateInput').value.trim();
            if (!guestName) { alert("Please input Guest Name detail parameters."); return; }

            submissionPayload.qrId = scannedQrId;
            submissionPayload.isManualLog = "false";
            submissionPayload.guestName = guestName;
            submissionPayload.plate = plateNo;

        } else if (currentPassType === "INVALID" || currentPassType === "ALREADY_ARRIVED") {
            const addr = document.getElementById('manualAddressInput').value.trim();
            const selectVal = document.getElementById('manualResidentSelect').value;
            const guestName = document.getElementById('manualGuestNameInput').value.trim();
            const plateNo = document.getElementById('manualPlateInput').value.trim();

            if (!addr || !selectVal || !guestName) {
                alert("Please satisfy required items: Address, Resident Selection, and Guest Name.");
                return;
            }

            submissionPayload.isManualLog = "true";
            submissionPayload.qrId = scannedQrId;
            submissionPayload.address = addr;
            submissionPayload.guestName = guestName;
            submissionPayload.plate = plateNo;
            submissionPayload.overrideReason = currentPassType === "ALREADY_ARRIVED" ? "ALREADY_ARRIVED_RESCAN" : "INVALID_QR";

            const realKey = Object.keys(residentDirectoryData).find(k => k.toLowerCase() === addr.toLowerCase());
            const residents = residentDirectoryData[realKey];

            if (selectVal === "OTHERS") {
                const manualName = document.getElementById('manualCustomNameInput').value.trim();
                submissionPayload.residentSurname = manualName || "Others";
                submissionPayload.residentFirstName = "";
            } else {
                const specificResident = residents[parseInt(selectVal)];
                submissionPayload.residentSurname = specificResident.surname;
                submissionPayload.residentFirstName = specificResident.firstName;
            }
        } else {
            return; 
        }

        const actionBtn = document.getElementById('confirmEntryBtn');
        actionBtn.innerText = "Processing Sheet Updates...";
        actionBtn.disabled = true;

        callBackend(submissionPayload, (data) => {
            actionBtn.disabled = false;
            if (data.result === "success") {
                const banner = document.getElementById('scannerStatusFlash');
                banner.className = "status-flash-banner mb-3 bg-success text-white py-3 fs-4 text-center fw-bold";
                banner.innerText = "ENTRY LOGGED SUCCESSFULLY";
                
                document.getElementById('individualFieldsWrapper').classList.add('hidden');
                document.getElementById('eventFieldsWrapper').classList.add('hidden');
                document.getElementById('manualFieldsWrapper').classList.add('hidden');
                actionBtn.classList.add('hidden');
            } else {
                alert("Transaction anomaly processing registration entry: " + data.message);
                if (currentPassType === "INVALID" || currentPassType === "ALREADY_ARRIVED") {
                    evaluateLiveScreeningDirectives();
                } else {
                    actionBtn.innerText = "Confirm Entry";
                }
            }
        });
    }
</script>
</body>
</html>
