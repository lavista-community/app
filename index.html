<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Vista Village Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { display: block; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #218838; }
        .page { display: none; }
        #loginPage { display: block; }
    </style>
</head>
<body>

    <div id="loginPage" class="container page">
        <h2>Resident Login</h2>
        <input type="email" id="emailInput" placeholder="Email Address">
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="performLogin()">Login</button>
    </div>

    <div id="dashboardPage" class="container page">
        <h2>Delivery Portal</h2>
        <input type="text" id="riderNameInput" placeholder="Rider Name">
        <button onclick="registerDelivery()">Pre-authorize Delivery</button>
        <button onclick="logout()" style="background:#dc3545; margin-top: 20px;">Logout</button>
    </div>

    <script>
        const APP_URL = "https://script.google.com/macros/s/AKfycbzRt3lWEX3mFPYgN8Dia5zfw2z3q2HIyVTOGgQ0-ASbZd0KKEnd9Au9pnPgtx0wwbId/exec";

        function performLogin() {
            var email = document.getElementById("emailInput").value;
            var password = document.getElementById("passwordInput").value;
            var payload = { action: "login", email: email, password: password };

            sendToAppsScript(payload, function(response) {
                if (response.result === "success") {
                    localStorage.setItem("user", JSON.stringify(response.info));
                    alert("Login successful!");
                    document.getElementById("loginPage").style.display = "none";
                    document.getElementById("dashboardPage").style.display = "block";
                } else {
                    alert("Login failed: " + response.message);
                }
            });
        }

        function registerDelivery() {
            var user = JSON.parse(localStorage.getItem("user"));
            if (!user) { alert("Please log in first."); return; }
            var payload = {
                action: "registerDeliveryPreAuth",
                surname: user.surname,
                firstName: user.firstName,
                address: user.address,
                riderName: document.getElementById("riderNameInput").value
            };
            sendToAppsScript(payload, function(response) {
                if (response.result === "success") alert("Delivery pre-authorized!");
                else alert("Error: " + response.message);
            });
        }

        function sendToAppsScript(payload, callback) {
            var url = APP_URL + "?callback=handleResponse&payload=" + encodeURIComponent(JSON.stringify(payload));
            window.handleResponse = callback;
            var script = document.createElement('script');
            script.src = url;
            document.body.appendChild(script);
        }

        function logout() {
            localStorage.removeItem("user");
            location.reload();
        }
    </script>
</body>
</html>
