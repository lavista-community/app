<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Vista Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #007aff; --bg-gray: #f2f2f7; }
        body { background-color: var(--bg-gray); font-family: -apple-system, sans-serif; }
        .hidden { display: none !important; }
        .login-card { background: white; border-radius: 28px; padding: 40px 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .menu-tile { background: white; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); aspect-ratio: 1/1; font-weight: 600; font-size: 14px; cursor: pointer; color: #1c1c1e; text-decoration: none; }
        .menu-tile i { font-size: 42px; margin-bottom: 12px; display: block; }
        .form-control { border-radius: 12px; padding: 12px; background: #e5e5ea; border: none; margin-bottom: 15px; }
        .btn-primary { border-radius: 12px; padding: 12px; font-weight: 700; background: var(--primary-blue); border: none; }
    </style>
</head>
<body>

<div id="loginUI" class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="login-card text-center">
        <h2 class="fw-bold mb-4" style="color: var(--primary-blue);">La Vista</h2>
        <input type="email" id="emailInput" class="form-control text-center" placeholder="Email">
        <input type="password" id="passwordInput" class="form-control text-center" placeholder="Password">
        <button onclick="attemptLogin()" id="loginBtn" class="btn btn-primary w-100">Sign In</button>
    </div>
</div>

<div id="dashboardUI" class="hidden">
    <div class="bg-white p-4 text-center border-bottom">
        <div id="welcomeMsg" class="h3 fw-bold text-primary mb-1">Hello!</div>
    </div>
    <div class="menu-grid">
        <div class="menu-tile" onclick="showSection('deliverySection')"><i class="bi bi-scooter text-indigo"></i>Deliveries</div>
        <div class="menu-tile" onclick="showSection('guestSection')"><i class="bi bi-journal-check text-success"></i>Guest Reg</div>
        <div class="menu-tile" onclick="showSection('staffSection')"><i class="bi bi-door-open text-info"></i>Staff Pass</div>
    </div>
    <div class="text-center py-4"><button class="btn btn-link text-danger" onclick="logout()">Logout</button></div>
</div>

<div id="deliverySection" class="hidden container py-4">
    <div class="bg-white p-4 rounded-5 shadow-sm">
        <h4 class="fw-bold mb-3">Register Delivery</h4>
        <input type="text" id="riderNameInput" class="form-control" placeholder="Courier Name">
        <input type="date" id="deliveryDateInput" class="form-control">
        <button onclick="submitDelivery()" id="deliveryBtn" class="btn btn-primary w-100">Log Delivery</button>
        <button onclick="showSection('dashboardUI')" class="btn btn-link w-100 mt-2 text-muted">Back</button>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRt3lWEX3mFPYgN8Dia5zfw2z3q2HIyVTOGgQ0-ASbZd0KKEnd9Au9pnPgtx0wwbId/exec";
    let currentUser = null;

    function callBackend(params, callback) {
        const url = APPS_SCRIPT_URL + "?callback=loadData&" + new URLSearchParams(params).toString();
        const script = document.createElement('script');
        window.loadData = (data) => { document.body.removeChild(script); callback(data); };
        script.src = url;
        document.body.appendChild(script);
    }

    function showSection(id) {
        document.getElementById('loginUI').classList.add('hidden');
        document.getElementById('dashboardUI').classList.add('hidden');
        document.getElementById('deliverySection').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function attemptLogin() {
        const email = document.getElementById('emailInput').value;
        const btn = document.getElementById('loginBtn');
        if (!email) { alert("Please enter email"); return; }
        
        btn.innerText = "Signing in...";
        btn.disabled = true;
        
        callBackend({ action: "getUserData", email: email }, (data) => {
            btn.innerText = "Sign In";
            btn.disabled = false;
            if (data.result === "success") {
                currentUser = data;
                document.getElementById('welcomeMsg').innerText = "Hello, " + data.info.firstName + "!";
                showSection('dashboardUI');
            } else {
                alert("Error: " + data.message);
            }
        });
    }

    function submitDelivery() {
        const btn = document.getElementById('deliveryBtn');
        const rider = document.getElementById('riderNameInput').value;
        const date = document.getElementById('deliveryDateInput').value;
        if (!rider || !date) { alert("Please fill all fields."); return; }
        
        btn.disabled = true;
        callBackend({
            action: "registerDelivery",
            riderName: rider,
            dateExpected: date,
            surname: currentUser.info.surname,
            firstName: currentUser.info.firstName,
            address: currentUser.info.address
        }, (data) => {
            btn.disabled = false;
            alert(data.result === "success" ? "Delivery Logged! ID: " + data.id : "Error: " + data.message);
            if(data.result === "success") showSection('dashboardUI');
        });
    }

    function logout() { location.reload(); }
</script>
</body>
</html>
