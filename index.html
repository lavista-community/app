<div class="menu-tile" onclick="showSection('deliverySection')">
    <i class="bi bi-scooter icon-indigo"></i>Deliveries
</div>

<div id="deliverySection" class="hidden container py-4">
    <div class="bg-white p-4 rounded-5 shadow-sm">
        <h4 class="fw-bold mb-1 text-indigo">Delivery Pre-auth</h4>
        <p class="text-muted small mb-4">Register an expected delivery for your residence.</p>
        
        <label class="form-label" for="riderNameInput">Rider/Courier Name</label>
        <input type="text" id="riderNameInput" class="form-control" placeholder="Courier Name">
        
        <label class="form-label" for="deliveryDateInput">Expected Date</label>
        <input type="date" id="deliveryDateInput" class="form-control">
        
        <button onclick="registerDelivery()" id="deliveryGenBtn" class="btn btn-indigo w-100 mt-2 fw-bold" style="background:#5856d6; color:white;">Authorize Delivery</button>
        <button onclick="showDashboard()" class="btn btn-link text-muted mt-3 text-decoration-none d-block mx-auto small">Back</button>
    </div>
</div>

<script>
    // ADD THIS FUNCTION TO YOUR SCRIPT SECTION
    function registerDelivery() {
        const name = document.getElementById('riderNameInput').value;
        const date = document.getElementById('deliveryDateInput').value;
        if (!name || !date) { alert("Please enter courier name and date."); return; }
        
        callBackend({
            action: "registerDelivery", // Ensure this matches your GS function name
            email: currentUser.info.email,
            riderName: name,
            date: date,
            surname: currentUser.info.surname,
            firstName: currentUser.info.firstName,
            address: currentUser.info.address
        }, (data) => {
            if (data.result === "success") {
                alert("Delivery Authorized!");
                showDashboard();
            } else {
                alert("Error: " + data.message);
            }
        });
    }
</script>
